# ==============================================================================
# Prometheus Configuration for AgentKernel Micro-Sandbox Monitoring
# Scrapes Prometheus metrics exposed by AgentKernel daemon at 5-second intervals.
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: "agentkernel"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["agentkernel:8080"]
        labels:
          environment: "production"
          service: "micro-sandbox-kernel"
