name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: agentkernel
            asset_bundle: agentkernel-x86_64-unknown-linux-gnu.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: agentkernel.exe
            asset_bundle: agentkernel-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin agentkernel

      - name: Package Linux release archive & SHA256
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/
          cd dist
          tar -czvf ../${{ matrix.asset_bundle }} ${{ matrix.bin_name }}
          cd ..
          sha256sum ${{ matrix.asset_bundle }} > ${{ matrix.asset_bundle }}.sha256

      - name: Package Windows release archive & SHA256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -p dist
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin_name }} -Destination dist/
          Compress-Archive -Path dist/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_bundle }} -Force
          $hash = (Get-FileHash ${{ matrix.asset_bundle }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_bundle }}" | Out-File -FilePath "${{ matrix.asset_bundle }}.sha256" -Encoding ascii

      - name: Upload release assets as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset_bundle }}
            ${{ matrix.asset_bundle }}.sha256

  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
